name: Deploy site100.ru

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SITE100_HOST }}
          username: ${{ secrets.SITE100_USER }}
          key: ${{ secrets.SITE100_KEY }}
          script: |
            cd ~/site100.ru/public_html/wp-content/themes/site100theme
            git pull
